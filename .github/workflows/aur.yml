name: aur

# Publish the AUR packages (wlr-utils from source, wlr-utils-bin from the
# cargo-dist archive) when a release is published. Runs in an Arch container so
# makepkg/updpkgsums/makepkg --printsrcinfo are available. The push uses a
# dedicated AUR deploy key (secret AUR_SSH_KEY) whose public half is registered
# on the AUR account — the maintainer's personal signing key never enters CI.
#
# It triggers on `release: published` so the -bin archive already exists; the
# source package only needs the git tag. Without AUR_SSH_KEY set, it still
# builds and validates each package but skips the push.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.5.0)
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: read
    env:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkgbuild: PKGBUILD
            name: wlr-utils
          - pkgbuild: PKGBUILD-bin
            name: wlr-utils-bin
    steps:
      - name: Resolve the release version
        id: ver
        run: |
          tag="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "pkgver=${tag#v}" >>"$GITHUB_OUTPUT"

      - name: Install tooling
        run: pacman -Syu --noconfirm --needed git openssh pacman-contrib rust clang

      - uses: actions/checkout@v4

      - name: Prepare the PKGBUILD
        working-directory: packaging/aur
        run: |
          cp "${{ matrix.pkgbuild }}" PKGBUILD
          # The release drives the version; a fresh version resets pkgrel to 1.
          sed -i "s/^pkgver=.*/pkgver=${{ steps.ver.outputs.pkgver }}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

      - name: Create a build user (makepkg refuses root)
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/builder
          chown -R builder: .

      - name: Fill sums, build, generate .SRCINFO
        working-directory: packaging/aur
        run: |
          sudo -u builder bash -euo pipefail -c '
            updpkgsums
            makepkg --syncdeps --force --noconfirm --noprogressbar
            makepkg --printsrcinfo > .SRCINFO
          '

      - name: Configure SSH for the AUR
        if: env.AUR_SSH_KEY != ''
        run: |
          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          EOF

      - name: Push to the AUR
        if: env.AUR_SSH_KEY != ''
        working-directory: packaging/aur
        run: |
          git config --global user.name  'Stéphane Jourdois'
          git config --global user.email 'stephane@jourdois.fr'
          git config --global --add safe.directory '*'
          # A never-published name clones as an empty repo; the first push creates it.
          git clone "ssh://aur@aur.archlinux.org/${{ matrix.name }}.git" aur-repo
          cp PKGBUILD .SRCINFO aur-repo/
          cd aur-repo
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No change for ${{ matrix.name }} ${{ steps.ver.outputs.tag }}."
          else
            git commit -m "Update to ${{ steps.ver.outputs.tag }}"
            git push
          fi

      - name: Note a skipped push
        if: env.AUR_SSH_KEY == ''
        run: echo "AUR_SSH_KEY not set — built and validated ${{ matrix.name }}, skipped the push."
