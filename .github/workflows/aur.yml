name: aur

# Publish the AUR packages (wlr-utils from source, wlr-utils-bin from the
# cargo-dist archive) on a release tag. Runs in an Arch container so
# makepkg/updpkgsums/makepkg --printsrcinfo are available. The push uses a
# dedicated AUR deploy key (secret AUR_SSH_KEY) whose public half is registered
# on the AUR account — the maintainer's personal signing key never enters CI.
#
# It triggers on the tag push (a GITHUB_TOKEN-created release does not emit a
# `release: published` event, so this can't key off that). The -bin package waits
# for the cargo-dist archive to be uploaded first; the source package only needs
# the git tag. Without AUR_SSH_KEY set, it still builds and validates each package
# but skips the push.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.5.0)
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: read
    env:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkgbuild: PKGBUILD
            name: wlr-utils
          - pkgbuild: PKGBUILD-bin
            name: wlr-utils-bin
    steps:
      - name: Resolve the release version
        id: ver
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "pkgver=${tag#v}" >>"$GITHUB_OUTPUT"

      - name: Install tooling
        run: pacman -Syu --noconfirm --needed git openssh pacman-contrib rust clang curl

      - name: Wait for the release archive (bin package)
        if: matrix.name == 'wlr-utils-bin'
        run: |
          url="https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}/wlr-utils-x86_64-unknown-linux-gnu.tar.xz"
          for _ in $(seq 1 40); do
            curl -sfI "$url" >/dev/null && exit 0
            echo "waiting for $url…"; sleep 30
          done
          echo "release archive still missing after waiting" >&2; exit 1

      - uses: actions/checkout@v4

      - name: Prepare the PKGBUILD
        working-directory: packaging/aur
        run: |
          # The source package's file is already named PKGBUILD (copying it onto
          # itself is an error); only the -bin variant needs renaming into place.
          if [ "${{ matrix.pkgbuild }}" != PKGBUILD ]; then
            cp "${{ matrix.pkgbuild }}" PKGBUILD
          fi
          # The release drives the version; a fresh version resets pkgrel to 1.
          sed -i "s/^pkgver=.*/pkgver=${{ steps.ver.outputs.pkgver }}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

      - name: Create a build user (makepkg refuses root)
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/builder
          chown -R builder: .

      - name: Fill sums, build, generate .SRCINFO
        working-directory: packaging/aur
        run: |
          sudo -u builder bash -euo pipefail -c '
            updpkgsums
            makepkg --syncdeps --force --noconfirm --noprogressbar
            makepkg --printsrcinfo > .SRCINFO
          '

      - name: Configure SSH for the AUR
        if: env.AUR_SSH_KEY != ''
        run: |
          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # A dedicated deploy key to a known host in ephemeral CI: skip host-key
          # verification outright rather than fight ssh-keyscan (which left a
          # conflicting entry and kept failing verification).
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Push to the AUR
        if: env.AUR_SSH_KEY != ''
        working-directory: packaging/aur
        run: |
          git config --global user.name  'Stéphane Jourdois'
          git config --global user.email 'stephane@jourdois.fr'
          git config --global --add safe.directory '*'
          # A never-published name clones as an empty repo; the first push creates it.
          git clone "ssh://aur@aur.archlinux.org/${{ matrix.name }}.git" aur-repo
          cp PKGBUILD .SRCINFO aur-repo/
          cd aur-repo
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No change for ${{ matrix.name }} ${{ steps.ver.outputs.tag }}."
          else
            git commit -m "Update to ${{ steps.ver.outputs.tag }}"
            git push
          fi

      - name: Note a skipped push
        if: env.AUR_SSH_KEY == ''
        run: echo "AUR_SSH_KEY not set — built and validated ${{ matrix.name }}, skipped the push."
